<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiTranslate — Онлайн переводчик текста (50+ языков)</title>
    
    <meta name="description" content="LumiTranslate — удобный онлайн-переводчик с выбором более 50 языков, озвучиванием текста и встроенным распознаванием речи.">
    <meta name="theme-color" content="#FFFFFF">
    
    <!-- Канонический URL, чтобы Google точно знал главное зеркало сайта -->
    <link rel="canonical" href="https://github.io">

    <!-- Настройки Open Graph для мессенджеров (Telegram, VK, Discord) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.io">
    <meta property="og:title" content="LumiTranslate — Онлайн переводчик текста">
    <meta property="og:description" content="Переводчик с выбором более 50 языков, озвучиванием текста и распознаванием речи.">
    <meta property="og:image" content="https://github.ioNORMAL_favicon_512.png">

    <!-- Подключение шрифтов и стилей (Ваш код) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Иконки (Ваш код) -->
    <link rel="icon" type="image/png" href="NORMAL_favicon_512.png">
    <link rel="apple-touch-icon" href="NORMAL_favicon_512.png">
    </head>
<body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="i-moon" viewBox="0 0 24 24">
            <path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10z"></path>
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4.5"></line>
            <line x1="12" y1="19.5" x2="12" y2="22"></line>
            <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
            <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
            <line x1="2" y1="12" x2="4.5" y2="12"></line>
            <line x1="19.5" y1="12" x2="22" y2="12"></line>
            <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
            <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
        </symbol>
    </svg>
    <header class="up">
        <img src="NORMAL_favicon_512.png" alt="Логотип LumiTranslate" class="img">
        <div class="brand-text">
            <h1 class="h1">LumiTranslate</h1>
            <p class="subtitle">Переводчик, поддерживающий более 50 языков, с озвучиванием и распознаванием речи.</p>
        </div>
        <button class="theme-button" id="theme-button" type="button" aria-label="Включить тёмную тему">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use id="theme-icon-use" href="#i-moon"></use>
            </svg>
        </button>
    </header>

    <main class="main">
        <section class="translator" aria-label="Переводчик">
            <div class="language-bar">
                <button class="language-choice" id="from-language" type="button" data-side="from" data-language="en"
                    aria-haspopup="dialog" aria-expanded="false" aria-label="Выбрать язык исходного текста">
                    <span class="language-name">English</span>
                    <span class="language-chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m7 10 5 5 5-5"></path>
                        </svg>
                    </span>
                </button>

                <button class="swap-button" id="swap-button" type="button" aria-label="Поменять языки местами">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path class="arrow-blue" d="M7 3v14m0 0-4-4m4 4 4-4"></path>
                        <path class="arrow-light" d="M17 21V7m0 0-4 4m4-4 4 4"></path>
                    </svg>
                </button>

                <button class="language-choice" id="to-language" type="button" data-side="to" data-language="ru"
                    aria-haspopup="dialog" aria-expanded="false" aria-label="Выбрать язык перевода">
                    <span class="language-name">Русский</span>
                    <span class="language-chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m7 10 5 5 5-5"></path>
                        </svg>
                    </span>
                </button>
            </div>

            <div class="text-panels">
                <section class="text-panel">
                    <label class="sr-only" for="source-text">Текст для перевода</label>
                    <!-- Поменяй текст здесь, чтобы изменить стартовое приветствие. -->
                    <textarea id="source-text" maxlength="5000"
                        placeholder="Введите текст">Welcome to LumiTranslate</textarea>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-button" id="listen-source" type="button"
                                aria-label="Прослушать исходный текст">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                    <path d="M19 10v1a7 7 0 0 1-14 0v-1m7 8v4m-4 0h8"></path>
                                </svg>
                            </button>
                            <button class="icon-button" id="speak-source" type="button"
                                aria-label="Озвучить исходный текст">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                                    <path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"></path>
                                </svg>
                            </button>
                            <button class="icon-button" id="copy-source" type="button"
                                aria-label="Скопировать исходный текст">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="8" y="8" width="13" height="13" rx="2"></rect>
                                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                                </svg>
                            </button>
                        </div>
                        <span class="character-count" id="character-count">24 / 5000</span>
                    </div>
                </section>

                <section class="text-panel result-panel">
                    <label class="sr-only" for="translated-text">Перевод</label>
                    <textarea id="translated-text" readonly placeholder="Перевод появится здесь"
                        aria-live="polite">Добро пожаловать в LumiTranslate</textarea>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-button" id="speak-result" type="button" aria-label="Озвучить перевод">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                                    <path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"></path>
                                </svg>
                            </button>
                            <button class="icon-button" id="copy-result" type="button" aria-label="Скопировать перевод">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="8" y="8" width="13" height="13" rx="2"></rect>
                                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                                </svg>
                            </button>
                        </div>
                        <span class="language-badge" id="result-language">RU</span>
                    </div>
                </section>
            </div>
            <p class="message" id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <div class="language-modal" id="language-modal" hidden>
        <button class="language-shade" type="button" aria-label="Закрыть выбор языка"></button>
        <section class="language-window" role="dialog" aria-modal="true" aria-labelledby="language-title">
            <div class="language-title-row">
                <div>
                    <p class="language-overline">LumiTranslate</p>
                    <h2 id="language-title">Выбери язык</h2>
                </div>
                <button class="close-language" id="close-language" type="button" aria-label="Закрыть">×</button>
            </div>

            <div class="language-tabs" role="tablist" aria-label="Списки языков">
                <span class="language-tab-slider" aria-hidden="true"></span>
                <button class="language-tab active" id="recent-tab" type="button" role="tab" aria-selected="true"
                    aria-controls="recent-panel">Недавно</button>
                <button class="language-tab" id="all-tab" type="button" role="tab" aria-selected="false"
                    aria-controls="all-panel">Все языки</button>
            </div>

            <label class="language-search">
                <span aria-hidden="true">⌕</span>
                <input id="language-search" type="search" aria-label="Найти язык" placeholder="Найти язык..."
                    autocomplete="off">
            </label>

            <div class="language-pages">
                <div class="language-track" id="language-track">
                    <section class="language-page recent-page" id="recent-panel" role="tabpanel"
                        aria-labelledby="recent-tab">
                        <div class="language-list" id="recent-languages"></div>
                        <p class="no-languages" id="no-recent" hidden>Здесь появятся недавно выбранные языки.</p>
                    </section>
                    <section class="language-page all-page" id="all-panel" role="tabpanel" aria-labelledby="all-tab"
                        aria-hidden="true">
                        <div class="language-list" id="all-languages"></div>
                        <p class="no-languages" id="no-results" hidden>Язык не найден. Попробуй другое название.</p>
                    </section>
                </div>
            </div>
            <p class="language-hint">Выбор сохраняется на этом устройстве</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
