<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiTranslate</title>
    <meta name="description" content="LumiTranslate — быстрый переводчик с супер физикой.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#6892ec">
    <link rel="canonical" href="https://classic-web2026.github.io/LumiTranslate/">
    <link rel="icon" type="image/png" href="NORMAL_favicon_512.png">
    <link rel="apple-touch-icon" href="NORMAL_app_512.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="LumiTranslate">
    <meta property="og:image" content="https://classic-web2026.github.io/LumiTranslate/NORMAL_favicon_512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <symbol id="i-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="i-mic" viewBox="0 0 24 24">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" fill="none" stroke="currentColor"
                stroke-width="1.8" />
            <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
            <path d="M11 5 6 9H3v6h3l5 4V5Z" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
            <rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M15 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor"
                stroke-width="1.8" />
        </symbol>
        <symbol id="i-swap" viewBox="0 0 24 24">
            <path d="M7 16V4M7 4 3 8M7 4l4 4M17 8v12M17 20l-4-4M17 20l4-4" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </symbol>
    </svg>
    <header class="up">
        <img src="NORMAL_favicon_512.png" alt="LumiTranslate" class="img" width="40" height="40">
        <div class="brand-text">
            <h1 class="h1">LumiTranslate</h1>
            <p class="subtitle">Переводчик</p>
        </div>
        <button class="theme-button ripple-btn" id="theme-button" type="button" aria-label="Тема"><svg
                viewBox="0 0 24 24" width="18" height="18">
                <use id="theme-icon-use" href="#i-moon"></use>
            </svg></button>
    </header>
    <main class="main">
        <section class="translator">
            <div class="language-bar">
                <button class="language-choice ripple-btn" id="from-language" data-side="from" data-language="en"><span
                        class="language-name">English</span><span class="chev"><svg width="14" height="14"
                            viewBox="0 0 24 24">
                            <use href="#i-chevron"></use>
                        </svg></span></button>
                <button class="swap-button ripple-btn" id="swap-button" aria-label="Поменять"><svg width="18"
                        height="18" viewBox="0 0 24 24">
                        <use href="#i-swap"></use>
                    </svg></button>
                <button class="language-choice ripple-btn" id="to-language" data-side="to" data-language="ru"><span
                        class="language-name">Русский</span><span class="chev"><svg width="14" height="14"
                            viewBox="0 0 24 24">
                            <use href="#i-chevron"></use>
                        </svg></span></button>
            </div>
            <div class="text-panels">
                <section class="text-panel">
                    <textarea id="source-text" maxlength="5000"
                        placeholder="Введите текст">Welcome to LumiTranslate</textarea>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-button ripple-btn" id="listen-source"><svg width="16" height="16"
                                    viewBox="0 0 24 24">
                                    <use href="#i-mic"></use>
                                </svg></button>
                            <button class="icon-button ripple-btn" id="speak-source"><svg width="16" height="16"
                                    viewBox="0 0 24 24">
                                    <use href="#i-volume"></use>
                                </svg></button>
                            <button class="icon-button ripple-btn" id="copy-source"><svg width="16" height="16"
                                    viewBox="0 0 24 24">
                                    <use href="#i-copy"></use>
                                </svg></button>
                        </div>
                        <span class="character-count" id="character-count">24 / 5000</span>
                    </div>
                </section>
                <section class="text-panel result-panel" id="result-panel">
                    <div class="skeleton" id="skeleton">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                    </div>
                    <textarea id="translated-text" readonly placeholder="Перевод"></textarea>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-button ripple-btn" id="speak-result"><svg width="16" height="16"
                                    viewBox="0 0 24 24">
                                    <use href="#i-volume"></use>
                                </svg></button>
                            <button class="icon-button ripple-btn" id="copy-result"><svg width="16" height="16"
                                    viewBox="0 0 24 24">
                                    <use href="#i-copy"></use>
                                </svg></button>
                        </div>
                        <span class="language-badge" id="result-language">RU</span>
                    </div>
                </section>
            </div>
            <p class="message" id="message"></p>
        </section>
    </main>
    <div class="language-modal" id="language-modal" hidden>
        <button class="language-shade"></button>
        <section class="language-window">
            <div class="language-title-row">
                <div>
                    <p class="language-overline">LumiTranslate</p>
                    <h2>Выбери язык</h2>
                </div><button class="close-language ripple-btn" id="close-language">×</button>
            </div>
            <div class="language-tabs"><span class="language-tab-slider"></span><button
                    class="language-tab active ripple-btn" id="recent-tab">Недавно</button><button
                    class="language-tab ripple-btn" id="all-tab">Все языки</button></div>
            <label class="language-search"><svg width="16" height="16" viewBox="0 0 24 24">
                    <use href="#i-search"></use>
                </svg><input id="language-search" type="search" placeholder="Найти язык..."></label>
            <div class="language-pages">
                <div class="language-track" id="language-track">
                    <section class="language-page">
                        <div class="language-list" id="recent-languages"></div>
                        <p class="no-languages" id="no-recent" hidden>Нет недавних</p>
                    </section>
                    <section class="language-page">
                        <div class="language-list" id="all-languages"></div>
                        <p class="no-languages" id="no-results" hidden>Не найдено</p>
                    </section>
                </div>
            </div>
            <p class="language-hint">Сохраняется на устройстве</p>
        </section>
    </div>
    <script src="script.js" charset="utf-8"></script>
</body>

</html>
